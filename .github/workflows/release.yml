name: Release

# TAG-TRIGGERED UPLOAD, MANUAL DRY RUN. This job archives and signs with
# the App Store Connect API key held in GitHub Actions secrets
# (ASC_KEY_ID / ASC_ISSUER_ID / ASC_PRIVATE_KEY).
#
#   - push of a burly-m*, burly-rc* or v* tag: archive, export and check
#     the .ipa, then UPLOAD that same .ipa to App Store Connect
#     (TestFlight) with altool.
#   - workflow_dispatch: DRY RUN. Archive and export an App Store .ipa
#     with destination "export", then ask App Store Connect to validate
#     it. It proves the key's role and the cloud distribution signing,
#     and it runs Apple's upload checks (purpose strings, icons,
#     entitlements) that a plain export never reaches. It NEVER uploads.
#     (GitHub only offers the manual run once this file is on the
#     default branch.)
#
# Signing happens once, at export, with the cloud-managed Apple
# Distribution certificate. The archive is built without a certificate
# (Scripts/archive-release.sh), because signing it made Apple mint a new
# development certificate on every run until the team hit the cap.
#
# It must never run on pull_request: a fork PR must never be able to see
# or exfiltrate these secrets. The `on:` block below already excludes
# pull_request, and the job-level `if:` allows exactly two cases (a tag
# push, or a manual dispatch) in case this file is ever copy/pasted next
# to a broader `on:` block. The upload step has its own, narrower `if:`
# (a push of a tag), so a dispatch cannot reach it even by mistake.
on:
  push:
    tags:
      - 'burly-m*'
      - 'burly-rc*'
      - 'v*'
  workflow_dispatch:

concurrency:
  # Scoped to the ref (the tag, or the branch for a dry run) rather than
  # the workflow, so pushing a second tag doesn't cancel an in-flight
  # upload for a different tag, and nothing cancels an upload that has
  # already started (cancel-in-progress is false). App Store Connect does
  # NOT de-dupe by build number -- it requires a unique version+build
  # pair and rejects a repeat. Safety against a re-run colliding with a
  # prior successful upload comes from the build number including
  # github.run_attempt (see the Resolve step below), not from any ASC
  # de-dupe behavior.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight-upload:
    name: Archive & upload to TestFlight (dry run on dispatch)
    # Exactly: a push of a tag, or a manual dispatch. pull_request can
    # never reach this job.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # True only for a tag push. Every step that uploads checks this.
      IS_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for tag annotation lookup

      # Same pin as ci.yml, for the same reason and with the same
      # fail-loud behavior if the runner image changes.
      - name: Select Xcode 26.6
        run: |
          XCODE_PATH=/Applications/Xcode_26.6.app
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Expected newest stable Xcode at $XCODE_PATH; available Xcodes follow"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      # Version numbering scheme (documented here, the only place it's
      # decided):
      #   MARKETING_VERSION comes from the tag name:
      #     burly-m<N>        -> 0.<N+1>.0   (m0 -> 0.1.0, m1 -> 0.2.0, ...;
      #                                       N must not have a leading
      #                                       zero, e.g. "m08" is rejected --
      #                                       see arithmetic note below)
      #     burly-rc<N>       -> 0.9.<N>     (RC candidates patch-bump off
      #                                       the M8 baseline; bare
      #                                       "burly-rc" == burly-rc1; same
      #                                       no-leading-zero rule on N)
      #     v<X.Y>            -> X.Y.0       (two-component tags are
      #                                       normalized to three, since
      #                                       Apple requires CFBundleShortVersionString
      #                                       to be three period-separated
      #                                       integers)
      #     v<X.Y.Z>          -> X.Y.Z       (the release train's actual
      #                                       App Store submission, taken
      #                                       literally)
      #   A dry run (workflow_dispatch) has no tag: it keeps the project's
      #   own MARKETING_VERSION and only overrides the build number.
      #   CURRENT_PROJECT_VERSION (the build number) is
      #   `github.run_number`.`github.run_attempt` -- run_number is
      #   monotonically increasing per workflow *identity* (not across the
      #   whole repo: renaming or recreating this workflow file restarts
      #   its numbering from 1, so that must not happen mid-release-train).
      #   run_number alone is also not enough: a workflow RE-RUN keeps the
      #   same run_number, and App Store Connect requires every upload to
      #   have a unique version+build pair -- it does not de-dupe a repeat.
      #   Appending run_attempt (which increments on each re-run) keeps a
      #   re-run's build number unique. CFBundleVersion permits dotted
      #   integers, so "N.M" is a valid build number.
      #   Both values are passed as xcodebuild command-line build
      #   setting overrides (see Archive step) rather than edited into
      #   the checked-out pbxproj, so the repo's committed baseline
      #   (0.1.0 / build 1) never drifts from what a plain `git clone` +
      #   local archive would produce.
      - name: Resolve release version from tag
        id: version
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}.${{ github.run_attempt }}"

          if [[ "$IS_TAG_PUSH" != "true" ]]; then
            # Dry run: no tag, keep the project's marketing version.
            {
              echo "label=dry-run"
              echo "tag="
              echo "marketing_version="
              echo "build_number=$BUILD_NUMBER"
            } >> "$GITHUB_OUTPUT"
            echo "Dry run (no upload): build number $BUILD_NUMBER, marketing version left as in the project"
            exit 0
          fi

          TAG="${GITHUB_REF#refs/tags/}"

          # Milestone/RC numbers use the `0|[1-9][0-9]*` pattern to reject
          # leading zeros (a bare "0" is still allowed). Without this,
          # "burly-m08" fails bash arithmetic ("value too great for base",
          # since 08 isn't valid octal) and "burly-m010" would silently be
          # parsed as octal 8 instead of decimal 10. The `10#` prefix on
          # the arithmetic below forces base-10 evaluation as a second,
          # belt-and-braces layer against the octal misparse.
          if [[ "$TAG" =~ ^burly-m(0|[1-9][0-9]*)$ ]]; then
            MILESTONE="${BASH_REMATCH[1]}"
            MARKETING_VERSION="0.$((10#$MILESTONE + 1)).0"
          elif [[ "$TAG" =~ ^burly-rc(0|[1-9][0-9]*)?$ ]]; then
            RC="${BASH_REMATCH[1]:-1}"
            MARKETING_VERSION="0.9.$((10#$RC))"
          elif [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            MARKETING_VERSION="${BASH_REMATCH[1]}.0"
          elif [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            MARKETING_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Tag '$TAG' does not match a known release pattern (burly-m<N>, burly-rc<N>, v<semver>)"
            exit 1
          fi

          {
            echo "label=$TAG"
            echo "tag=$TAG"
            echo "marketing_version=$MARKETING_VERSION"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=$BUILD_NUMBER"

      # See Scripts/release-notes.sh for the full what's-new sourcing
      # design. Short version: the dispatcher writes the milestone
      # digest headline into the ANNOTATION of the tag it pushes; CI
      # cannot reach the private planning repo, so the tag annotation is
      # the only channel available at build time. This step just
      # extracts it to a file/artifact/job-summary so the dispatcher's
      # post-upload step (which sets TestFlight "What to Test" via
      # asc-mcp once the build finishes processing) doesn't have to
      # re-derive it later. A dry run has no tag, so it skips this.
      - name: Extract what's-new from tag annotation
        if: env.IS_TAG_PUSH == 'true'
        id: whats-new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The annotation is text chosen by whoever pushes the tag. It
          # goes to a file first, then to the log inside a
          # ::stop-commands:: window (so a line starting with "::" is not
          # run as a workflow command), and into the job summary as an
          # indented code block (so it cannot close a fence).
          #
          # actions/checkout leaves refs/tags/$TAG as a LIGHTWEIGHT ref: it
          # fetches all tags, sees that the ref resolves to the tag object
          # rather than GITHUB_SHA, and force-fetches "+<sha>:refs/tags/<tag>"
          # over it. release-notes.sh then rightly refuses to read a commit
          # message and prints its placeholder. Free Lunch's first real
          # upload (fl-m0, 2026-11-02) showed this with the same checkout
          # settings as above. So fetch the tag object back, and use it only
          # if it still points at the commit this run built (the tag may
          # have moved since). Missing notes must not block an upload, so
          # any failure here warns and writes a one-line note instead.
          if git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" \
            && [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]]; then
            Scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/whats-new.txt"
          else
            echo "::warning::Could not restore the annotated tag $TAG at $GITHUB_SHA; what's-new not extracted."
            echo "No release notes extracted ($TAG could not be re-fetched at the commit this run built)." > "$RUNNER_TEMP/whats-new.txt"
          fi
          STOP_TOKEN="$(uuidgen)"
          echo "::stop-commands::$STOP_TOKEN"
          cat "$RUNNER_TEMP/whats-new.txt"
          echo "::$STOP_TOKEN::"
          {
            echo "## What's new (from tag annotation)"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/whats-new.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Written with a restrictive umask so the key is never
      # world/group-readable even for the brief window it exists on
      # disk, and removed unconditionally in the cleanup step below
      # regardless of whether later steps succeed. The secret reaches the
      # step through the environment, not through script interpolation.
      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/asc.p8"

      # No certificate, no profile and no Apple contact: the archive is
      # built unsigned and then signed ad hoc with each app's entitlements
      # (see the script's header). Signing it the usual way, with automatic
      # signing and -allowProvisioningUpdates, made Apple mint an "Apple
      # Development: Created via API" certificate on every run, and the
      # team hit the certificate cap on 2026-11-03
      # (dfakkeldy/grok-bots#873). The export below does the real signing.
      # The acceptance gate (Scripts/acceptance-sim.sh) archives through
      # the same script, so a pull request proves this step too.
      - name: Archive BurlyPhone
        env:
          MARKETING_VERSION_OVERRIDE: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          overrides=("CURRENT_PROJECT_VERSION=$BUILD_NUMBER")
          if [[ -n "$MARKETING_VERSION_OVERRIDE" ]]; then
            overrides+=("MARKETING_VERSION=$MARKETING_VERSION_OVERRIDE")
          fi
          Scripts/archive-release.sh "$RUNNER_TEMP/Burly.xcarchive" \
            "${overrides[@]}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      # One export-options file, destination "export": -exportArchive
      # signs for distribution and writes an .ipa to disk; nothing in it
      # uploads. Uploading is a separate altool step that sends that same
      # file, so the .ipa that passed the checks is the one Apple receives.
      # uploadSymbols puts the dSYMs in the .ipa for that upload.
      # teamID is spelled out because an archive built without a
      # certificate carries no team for the export to read. It is the
      # project's DEVELOPMENT_TEAM, public in project.pbxproj.
      - name: Write export options
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>8AXNA5B37R</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

      # Every run, dry run or tag push. destination "export" signs for
      # distribution (which is what needs the Admin-role key and the
      # cloud-managed distribution certificate) and writes an .ipa, but
      # contacts no upload service. Scripts/check-exported-ipa.sh then
      # checks that both apps are distribution-signed and kept their
      # HealthKit entitlements through the re-sign, so a tag push never
      # uploads a build that would fail Health on a tester's watch.
      - name: Export and check App Store .ipa (no upload)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Burly.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          ls -l "$RUNNER_TEMP/export"
          shopt -s nullglob
          IPAS=("$RUNNER_TEMP"/export/*.ipa)
          if (( ${#IPAS[@]} != 1 )); then
            echo "::error::expected exactly one .ipa in \$RUNNER_TEMP/export, found ${#IPAS[@]}"
            exit 1
          fi
          Scripts/check-exported-ipa.sh "${IPAS[0]}" 2>&1 | tee "$RUNNER_TEMP/check.log"
          echo "Exported and checked an App Store .ipa; nothing was uploaded by this step." | tee -a "$GITHUB_STEP_SUMMARY"

      # DRY RUN ONLY. Sends the checked .ipa to App Store Connect for
      # validation: the server-side checks an upload runs before Apple
      # accepts it, but no build is created. The export above never reaches
      # those checks, so without this step a missing purpose string
      # (ITMS-90683) surfaces only on a tag push; Free Lunch's first
      # upload was refused that way. Apple calls this validation limited,
      # so it narrows the gap rather than guaranteeing an upload will pass.
      # Scripts/altool-ipa.sh holds the key handling and the strict
      # pass/fail matching shared with the upload step below.
      - name: Validate .ipa with App Store Connect (dry run, no upload)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/asc/asc.p8" \
            Scripts/altool-ipa.sh validate "$RUNNER_TEMP/export" "$RUNNER_TEMP/validate.log"
          echo "Dry run: App Store Connect validated the .ipa; nothing was uploaded." | tee -a "$GITHUB_STEP_SUMMARY"

      # THE ONLY UPLOAD. Reachable only from a push of a tag, and only
      # after the export above passed its checks. It uploads that same
      # checked .ipa, not a second export, so the file Apple receives is
      # the file whose signing and entitlements were checked.
      - name: Upload the checked .ipa to App Store Connect
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ASC_KEY_PATH="$RUNNER_TEMP/asc/asc.p8" \
            Scripts/altool-ipa.sh upload "$RUNNER_TEMP/export" "$RUNNER_TEMP/upload.log"
          echo "Uploaded the checked .ipa to App Store Connect." | tee -a "$GITHUB_STEP_SUMMARY"

      # Belt-and-braces: runs even if archive/export failed above, and
      # even though $RUNNER_TEMP itself is wiped at the end of the job
      # regardless. The key must not survive to the next step's cache
      # or to a debugging shell an operator might attach later in the
      # same job. Removes the whole directory, so the key copy
      # Scripts/altool-ipa.sh makes beside it goes too if that step was
      # killed.
      - name: Remove ASC private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      # Log tail only, and only the xcodebuild and altool logs -- never
      # the export-options plists (no secrets in them) or anything under
      # $RUNNER_TEMP/asc. The real key material (the .p8 file contents)
      # is never printed by any step above -- only referenced by path.
      #
      # GitHub Actions masks secret values in the live log, but NOT in
      # uploaded artifact files, and this repo is public. xcodebuild does
      # print the key ID: cloud signing names the certificate it creates
      # "Apple Development: Created via API (<key ID>)", and the archive
      # log shows that signing identity (seen in the first dry run of
      # Free Lunch's port of this lane). So the key ID and issuer ID are
      # replaced with *** before upload. perl's \Q...\E matches each
      # value literally, and an empty value is skipped rather than
      # turned into an empty pattern.
      - name: Prepare build log tail for upload
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/log-tail"
          for f in archive export check validate upload; do
            if [[ -f "$RUNNER_TEMP/$f.log" ]]; then
              tail -n 500 "$RUNNER_TEMP/$f.log" \
                | perl -pe 'for my $v (@ENV{qw(ASC_KEY_ID ASC_ISSUER_ID)}) { s/\Q$v\E/***/g if length($v // "") }' \
                > "$RUNNER_TEMP/log-tail/$f.tail.log"
            fi
          done

      - name: Upload build log tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log-${{ steps.version.outputs.label || 'unresolved' }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/log-tail/*.tail.log
            ${{ runner.temp }}/whats-new.txt
          if-no-files-found: warn
          retention-days: 30
